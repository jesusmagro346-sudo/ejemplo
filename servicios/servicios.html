<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soluciones Tecnológicas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra de navegación con enlace de ancla directo -->
    <nav class="navbar">
    <ul class="nav-links">
      <li>
        <a href="/index.html" class="btn-nav">
          <span class="btn-icon">←</span> Volver
        </a>
      </li>
    </ul>
  </nav>

  <!-- Sección de Servicios / Productos -->
  <section id="servicios" class="services-section">
    <h2 class="section-title">Nuestros Servicios Tecnológicos</h2>
    <p class="section-subtitle">Haz clic en cualquiera de las cartas para desplegar los detalles.</p>

    <div class="cards-grid">

      <!-- Carta 1 -->
      <div class="card-item">
        <input type="checkbox" id="card-1" class="card-toggle">
        <label for="card-1" class="card">
          <div class="card-summary">
            <span class="card-icon">💻</span>
            <h3>Desarrollo Web & Apps</h3>
            <p class="card-preview">Software a medida para web y dispositivos móviles.</p>

          </div>
          <div class="card-details">
            <h4>Detalles del Servicio</h4>
            <p>Diseñamos y desarrollamos plataformas web, aplicaciones móviles y sistemas administrativos adaptados a los procesos específicos de tu empresa, garantizando alto rendimiento, diseño moderno y escalabilidad.</p>
          </div>
        </label>
      </div>

      <!-- Carta 2 -->
      <div class="card-item">
        <input type="checkbox" id="card-2" class="card-toggle">
        <label for="card-2" class="card">
          <div class="card-summary">
            <span class="card-icon">☁️</span>
            <h3>Cloud & DevOps</h3>
            <p class="card-preview">Infraestructura y servidores en la nube.</p>

          </div>
          <div class="card-details">
            <h4>Detalles del Servicio</h4>
            <p>Implementamos y gestionamos servidores en la nube (AWS, Azure, GCP), arquitectura en contenedores Docker y despliegues automáticos para asegurar que tus sistemas estén siempre disponibles y optimizados.</p>
          </div>
        </label>
      </div>

      <!-- Carta 3 -->
      <div class="card-item">
        <input type="checkbox" id="card-3" class="card-toggle">
        <label for="card-3" class="card">
          <div class="card-summary">
            <span class="card-icon">🛡️</span>
            <h3>Ciberseguridad TI</h3>
            <p class="card-preview">Protección de datos y auditorías de seguridad.</p>

          </div>
          <div class="card-details">
            <h4>Detalles del Servicio</h4>
            <p>Evaluamos vulnerabilidades, implementamos copias de seguridad automatizadas, firewalls y protocolos de cifrado para proteger la información crítica de tu organización frente a amenazas digitales.</p>
          </div>
        </label>
      </div>

    </div>
  </section>

</body>
</html>
